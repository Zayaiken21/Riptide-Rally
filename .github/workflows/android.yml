name: Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'app/**', '.github/workflows/android.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build the Android app
        working-directory: app
        run: |
          npm install
          node prepare-web.mjs
          npx cap add android
          npx capacitor-assets generate --android || echo "icon generation skipped"
          node patch-native.mjs android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: riptide-rally-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
