name: Store unlocks
# Every few minutes: checks Stripe for new payments and sends each buyer their unlock automatically.
# Needs two repo secrets: STRIPE_SECRET_KEY and PRIVATE_KEY_JWK (see server/README.md).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-unlocks
  cancel-in-progress: false
jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install relay client
        run: npm install --no-save --no-package-lock mqtt@5.16.1
      - name: Deliver unlocks
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PRIVATE_KEY_JWK: ${{ secrets.PRIVATE_KEY_JWK }}
        run: node server/grant.mjs
      - name: Save the public key to shop.json (first run only)
        run: |
          if ! git diff --quiet shop.json; then
            git config user.name "riptide-store-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Store: add public key" shop.json
            git push
          fi
