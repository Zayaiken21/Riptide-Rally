<meta property="og:image" content="https://zayaiken21.github.io/Riptide-Rally/og-join.jpg">

<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#062530">
<style>
  html, body { margin: 0; height: 100%; background: #062530; color: #f4fbfc; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: grid; place-items: center; text-align: center; padding: 16px; box-sizing: border-box; }
  img { width: min(420px, 80vw); height: auto; }
  a { display: inline-block; margin-top: 18px; background: #3ee06a; color: #06212b; font-weight: 800; text-decoration: none; padding: 12px 26px; border-radius: 12px; font-size: 18px; }
  p { color: #9cc3cc; }
</style>
</head>
<body>
<main>
  <img src="icons/title.png" alt="Riptide Rally">
  <p id="msg">Taking you to the race…</p>
  <a id="go" href="./">Join the race</a>
</main>
<script>
  // Invite links look like join.html?r=3 so chat apps show the "Join my race" preview; the game itself reads #join-3.
  var r = (new URLSearchParams(location.search).get('r') || location.hash.replace(/^#(join-)?/, '')).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
  var target = './' + (r ? '#join-' + r : '');
  document.getElementById('go').href = target;
  if (!r) document.getElementById('msg').textContent = 'This invite is missing its room number. Open the game and pick the race from the list.';
  location.replace(target);
</script>
</body>
</html>
